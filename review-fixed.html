<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: #333;
    }
    .site-header {
      background-color: #003366;
      color: #ffffff;
      padding: 20px;
    }
    .site-header h1 {
      font-size: 32px;
      margin: 0 0 10px;
    }
    .site-header nav a {
      color: #e0e0e0;
      margin-right: 10px;
      text-decoration: none;
    }
    .site-header nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    main h2 {
      font-size: 24px;
    }
    main img {
      max-width: 100%;
    }
    form label {
      display: block;
      margin-top: 10px;
    }
    form input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-top: 4px;
    }
    footer {
      text-align: center;
      padding: 10px;
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>STT Cipasung</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Programs</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>About Us</h2>
      <p>STT Cipasung is a technology college in Tasikmalaya.</p>
      <img src="https://placehold.co/600x300?text=STT+Cipasung" alt="STT Cipasung campus building">
    </section>

    <section>
      <h2>Contact Us</h2>
      <form action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email">

        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Copyright 2026</p>
  </footer>
</body>
</html>
